baseURL = "https://may-blog.pages.dev/"
title = "May 的博客"
theme = "blowfish"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  colorScheme = "blowfish"
  defaultAppearance = "auto"
  autoSwitchAppearance = true
  enableSearch = true
  mainSections = ["posts"]
  description = "May 的博客。技术、学习、工作、日常，甭管什么，记点儿是点儿，省得回头全忘了。"

  # ===== 首页个人主页布局 =====
  [params.homepage]
    layout = "profile"

  [params.profile]
    enabled = true
    name = "May"
    bio = "技术、学习、工作、日常，慢慢记，慢慢写。"
    avatar = "img/avatar.png"
    avatarUrl = ""
    showInHeader = true
    showInFooter = true

    [[params.profile.social]]
      name = "GitHub"
      url = "https://github.com/zhimingji"
      icon = "github"

  # ===== 头部 =====
  [params.header]
    layout = "fixed"
    showLogo = true

  # ===== 文章页 =====
  [params.article]
    showReadingTime = true
    showTableOfContents = true
    showTaxonomies = true
    showWordCount = true
    showDate = true
    showAuthor = false
    showBreadcrumbs = true
    sharingLinks = ["github", "x", "weibo"]

  # ===== 列表页 =====
  [params.list]
    showTags = true
    showReadingTime = true
    groupByYear = false
    cardView = true

  # ===== 页脚 =====
  [params.footer]
    showCopyright = true
    showThemeAttribution = true

[menu]
  [[menu.main]]
    name = "写的东西"
    pageRef = "/posts"
    weight = 10
  [[menu.main]]
    name = "标签"
    pageRef = "/tags"
    weight = 20
  [[menu.main]]
    name = "关于"
    pageRef = "/about"
    weight = 30
