baseURL = "https://may-blog.pages.dev/"
title = "May 的博客"
theme = "blowfish"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  colorScheme = "blowfish"
  defaultAppearance = "auto"
  autoSwitchAppearance = true
  enableSearch = true
  mainSections = ["posts"]
  description = "May 的博客。技术、学习、工作、日常，甭管什么，记点儿是点儿，省得回头全忘了。"

  [params.header]
    layout = "basic"

  [params.footer]
    showCopyright = true

  [params.article]
    showReadingTime = true
    showTableOfContents = true
    showTaxonomies = true
    showWordCount = true

  [params.list]
    showTags = true
    groupByYear = false

[menu]
  [[menu.main]]
    name = "写的东西"
    pageRef = "/posts"
    weight = 10
  [[menu.main]]
    name = "标签"
    pageRef = "/tags"
    weight = 20
  [[menu.main]]
    name = "关于"
    pageRef = "/about"
    weight = 30
