# ===== 基础配置 =====
baseURL = "https://may-blog.pages.dev/"
title = "May's Blog"
theme = "PaperMod"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
hasCJKLanguage = true

# ===== 分页 =====
[pagination]
  pagerSize = 20

# ===== 站点参数 =====
[params]
  author = "May"
  description = "May 的博客。技术、学习、工作、日常，甭管什么，记点儿是点儿，省得回头全忘了。"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowSearch = true
  mainSections = ["posts"]

  # 首页个人信息
  [params.homeInfoParams]
    Title = "Hi,我是 May"
    Content = "这里没什么大道理，就是记点技术、工作和日子里的事。想到什么写什么，慢慢来。"

  # 社交图标
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/zhimingji"

# ===== 顶部菜单 =====
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 30

# ===== 输出格式（搜索需要 JSON）=====
[outputs]
  home = ["HTML", "RSS", "JSON"]
